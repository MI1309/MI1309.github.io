<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Arsip proyek Muhammad Imron" />
  <title>Archive | Muhammad Imron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #071126; --line: rgba(171, 191, 231, .14); --muted: #9eafd1; --text: #eef3ff; --accent: #51e1d2; --tag: #0a304c; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; color: var(--text); font-family: Inter, Arial, sans-serif; background: radial-gradient(circle at 50% -15%, #1a2b53 0, var(--bg) 48%, #050d1d 100%); }
    .archive { width: min(1184px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; padding: 112px 0 72px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 16px; font-weight: 700; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    h1 { margin: 6px 0 54px; color: var(--text); font-size: clamp(40px, 5vw, 52px); line-height: 1.1; letter-spacing: -.045em; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 760px; border-collapse: collapse; text-align: left; }
    th { padding: 0 0 20px; color: #d3dbed; font-size: 14px; font-weight: 700; }
    td { padding: 18px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; vertical-align: top; }
    th:nth-child(1), td:nth-child(1) { width: 88px; }
    th:nth-child(2), td:nth-child(2) { width: 43%; padding-right: 30px; }
    th:nth-child(3), td:nth-child(3) { width: 36%; padding-right: 24px; }
    .project-title { margin: 0 0 5px; color: var(--text); font-size: 16px; font-weight: 700; line-height: 1.35; }
    .project-description { max-width: 470px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { display: inline-block; padding: 5px 12px; border-radius: 999px; background: var(--tag); color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .project-link { color: #9db2df; text-decoration: none; overflow-wrap: anywhere; }
    .project-link:hover { color: var(--accent); }
    .status { padding: 26px 0; border-top: 1px solid var(--line); color: var(--muted); }
    @media (max-width: 640px) { .archive { width: min(100% - 32px, 1184px); padding-top: 64px; } h1 { margin-bottom: 36px; } }
  </style>
</head>
<body>
  <main class="archive">
    <a class="back-link" href="index.html" aria-label="Kembali ke halaman utama">← Muhammad Imron</a>
    <h1>All Projects</h1>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">Year</th><th scope="col">Project</th><th scope="col">Built with</th><th scope="col">Link</th></tr></thead>
        <tbody id="archive-list"><tr><td class="status" colspan="4">Memuat proyek…</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const getYear = (item) => item.year || (item.date ? new Date(item.date).getFullYear() : '—');
    const getTags = (item) => Array.isArray(item.technologies) && item.technologies.length ? item.technologies : [item.title?.startsWith('Blog') ? 'Article' : 'Project'];
    const linkLabel = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url || '—'; } };
    async function loadArchive() {
      const list = document.getElementById('archive-list');
      try {
        let response = await fetch('data/archive.json');
        if (!response.ok) response = await fetch('/api/archive');
        if (!response.ok) throw new Error('Archive could not be loaded');
        const projects = await response.json();
        if (!Array.isArray(projects) || !projects.length) throw new Error('No archive items');
        list.innerHTML = projects.map(item => {
          const url = item.url || '';
          return `<tr><td>${escapeHtml(getYear(item))}</td><td><h2 class="project-title">${escapeHtml(item.title)}</h2><p class="project-description">${escapeHtml(item.description)}</p></td><td><div class="tags">${getTags(item).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div></td><td>${url ? `<a class="project-link" href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(linkLabel(url))} ↗</a>` : '—'}</td></tr>`;
        }).join('');
      } catch (error) {
        list.innerHTML = '<tr><td class="status" colspan="4">Proyek belum dapat dimuat.</td></tr>';
      }
    }
    loadArchive();
  </script>
</body>
</html>
