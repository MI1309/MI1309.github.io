name: Update resume via admin

on:
  repository_dispatch:
    types: [update-resume]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT }}

      - name: Update resume files
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const update = event.client_payload?.resume;
          const resumePath = path.join('public', 'resume.pdf');

          if (update?.action === 'upload' && typeof update.content === 'string') {
            const pdf = Buffer.from(update.content, 'base64');
            if (pdf.length > 3 * 1024 * 1024 || !pdf.subarray(0, 5).equals(Buffer.from('%PDF-'))) {
              throw new Error('Resume payload is not a valid PDF within the size limit.');
            }
            fs.mkdirSync('public', { recursive: true });
            fs.writeFileSync(resumePath, pdf);
            fs.writeFileSync('data/resume.json', JSON.stringify({
              available: true,
              filename: 'resume.pdf',
              updatedAt: new Date().toISOString(),
            }, null, 2) + '\n');
          } else if (update?.action === 'delete') {
            fs.rmSync(resumePath, { force: true });
            fs.writeFileSync('data/resume.json', JSON.stringify({
              available: false,
              filename: 'resume.pdf',
            }, null, 2) + '\n');
          } else {
            throw new Error('Unsupported resume action.');
          }
          NODE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resume.json public/resume.pdf
          git commit -m "Update resume via admin" || echo "no changes"
          git push
