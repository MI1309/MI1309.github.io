<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
        <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="content" style="padding:2rem;max-width:640px;margin:auto;">
        <h1>Admin Login</h1>
        <p>Masukkan password untuk mengakses halaman admin. Anda harus mengetahui URL admin tersembunyi.</p>
        <form id="loginForm">
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <button type="submit">Masuk</button>
        </form>
        <div id="msg" role="status" style="margin-top:1rem;color:#b00"></div>
    </main>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const res = await fetch('/api/login', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const json = await res.json();
        if (res.ok) {
            // redirect to project admin under the same hidden route path
            const p = window.location.pathname.replace(/\/login\/?$/, '/project');
            window.location.href = p;
        } else {
            document.getElementById('msg').textContent = json.error || 'Login failed';
        }
    });
    </script>
</body>
</html>
